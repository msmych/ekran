server {
    listen 80;
    server_name ekran.uk ekran.matvey.uk;

    # ACME HTTP-01 challenge for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ekran.uk;

    server_tokens off;

    # always: 404s/503s must carry the headers too
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    ssl_certificate     /etc/letsencrypt/live/ekran.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ekran.uk/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# legacy domain: permanent redirect only — keep renewing its certificate
# (and this block) until the migration settles, then drop both
server {
    listen 443 ssl;
    http2 on;
    server_name ekran.matvey.uk;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    ssl_certificate     /etc/letsencrypt/live/ekran.matvey.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ekran.matvey.uk/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://ekran.uk$request_uri;
}