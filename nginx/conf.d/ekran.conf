server {
    listen 80;
    server_name ekran.matvey.uk;

    # ACME HTTP-01 challenge for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ekran.matvey.uk;

    ssl_certificate     /etc/letsencrypt/live/ekran.matvey.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ekran.matvey.uk/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
