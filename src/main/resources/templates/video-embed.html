<div class="video-embed" xmlns:th="http://www.thymeleaf.org" th:fragment="embed(key, autoplay)">
    <iframe th:src="'https://www.youtube-nocookie.com/embed/' + ${key} + '?enablejsapi=1' + (${autoplay} ? '&autoplay=1' : '')"
            title="YouTube video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
            loading="lazy"></iframe>
</div>
