<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{head :: head(${vm.title()} + ' — ekran')}"></head>
<body>
<div id="topbar" class="htmx-indicator" aria-hidden="true"></div>
<main class="wrap" hx-boost="true" hx-indicator="#topbar">
    <div th:replace="~{header :: header(false)}"></div>
    <article class="movie">
        <header class="movie-head">
            <!-- the small poster opens its full-size version in a dialog -->
            <th:block th:if="${vm.posterUrl() != null}">
                <button type="button" class="poster-button" data-dialog="poster" aria-label="View full poster">
                    <img class="poster" th:src="${vm.posterUrl()}" alt="">
                </button>
            </th:block>
            <div class="movie-info">
                <!-- the mark toggle sits at the title row's right edge, the
                     same corner it takes in the cards' row view -->
                <div class="movie-title-row">
                    <h2 th:text="${vm.title()}">Title</h2>
                    <button type="button"
                            class="mark-toggle"
                            th:classappend="${marked} ? 'marked'"
                            data-mark-button
                            aria-label="Mark movie (m)"
                            th:attr="aria-pressed=${marked} ? 'true' : 'false', data-movie-id=${vm.tmdbId()}">
                        <th:block th:replace="~{bookmark-icon :: icon(18)}"></th:block>
                    </button>
                </div>
                <p class="original-title" th:if="${vm.originalTitle() != null}" th:text="${vm.originalTitle()}">Original title</p>
                <p class="meta-line">
                    <span th:if="${vm.year() != null}" th:text="${vm.year()}">1979</span>
                    <span th:if="${vm.runtime() != null}" th:text="${vm.runtime()}">1h 52m</span>
                    <span th:if="${vm.genres() != null}" th:text="${vm.genres()}">Genres</span>
                </p>
<!-- the user's note on the movie — its own thing, independent of the mark
                     (marks are the bare inbox): noting needs no mark, unmarking and
                     moving marks into playlists never touch it. Notes are a
                     signed-in feature: the slot renders only then (:empty hides
                     it from anonymous visitors) -->
                <div class="movie-note"><th:block th:if="${userId != null}" th:with="note=${movieNote}, editUrl='/movies/' + ${vm.tmdbId()} + '/note/edit', movieNote=true"><div th:replace="~{note-area}"></div></th:block></div>
                <div class="movie-playlists-row">
                    <div th:replace="~{playlist-chips :: chips(${memberships}, ${vm.tmdbId()}, false)}"></div>
                </div>
                <!-- the trailers chip sits below the playlist chips, out of the
                     title row — the note icon leads the row above it -->
                <div class="movie-trailers-row" th:if="${!vm.videos().isEmpty()}">
                    <a class="trailers-button"
                       th:href="'https://www.youtube.com/watch?v=' + ${vm.videos()[0].key()}"
                       data-dialog="trailers"
                       th:text="'Trailers (' + ${#lists.size(vm.videos())} + ')'">Trailers</a>
                </div>
            </div>
        </header>
        <th:block th:if="${memberships != null}">
            <th:block th:replace="~{playlist-dialog :: playlistDialog}"></th:block>
        </th:block>
        <p class="overview" th:if="${vm.overview() != null}" th:text="${vm.overview()}">Overview</p>
        <section class="credits">
            <div th:if="${!vm.directors().isEmpty()}">
                <h3 th:text="${#lists.size(vm.directors()) > 1} ? 'Directors' : 'Director'">Director</h3>
                <ul class="crew">
                    <li th:each="p : ${vm.directors()}">
                        <a th:href="${p.href()}" th:text="${p.name()}">Name</a>
                    </li>
                </ul>
            </div>
            <div th:if="${!vm.writers().isEmpty()}">
                <h3 th:text="${#lists.size(vm.writers()) > 1} ? 'Writers' : 'Writer'">Writer</h3>
                <ul class="crew">
                    <li th:each="p : ${vm.writers()}">
                        <a th:href="${p.href()}" th:text="${p.name()}">Name</a>
                        <span class="role" th:if="${p.role() != null}" th:text="${p.role()}">Screenplay</span>
                    </li>
                </ul>
            </div>
            <div th:if="${!vm.cast().isEmpty()}">
                <h3>Cast</h3>
                <ul class="crew">
                    <li th:each="p : ${vm.cast()}">
                        <a th:href="${p.href()}" th:text="${p.name()}">Name</a>
                        <span class="role" th:if="${p.role() != null}" th:text="${p.role()}">Character</span>
                    </li>
                </ul>
            </div>
        </section>
        <!-- the external link lives at the bottom, out of the busy head -->
        <p class="external-links">
            <a th:href="${vm.tmdbUrl()}" target="_blank" rel="noopener">TMDB ↗</a>
        </p>
        <dialog id="poster" aria-labelledby="poster-dialog-title" th:if="${vm.posterUrl() != null}">
            <div class="dialog-head">
                <h2 id="poster-dialog-title" th:text="${vm.title()}">Title</h2>
                <button type="button" class="dialog-close" data-dialog-close aria-label="Close">✕</button>
            </div>
            <img class="poster-full" th:src="${vm.fullPosterUrl()}" th:alt="${vm.title()}">
        </dialog>
        <dialog id="trailers" aria-labelledby="trailers-dialog-title" th:if="${!vm.videos().isEmpty()}">
            <div class="dialog-head">
                <h2 id="trailers-dialog-title">Trailers</h2>
                <button type="button" class="dialog-close" data-dialog-close aria-label="Close">✕</button>
            </div>
            <div id="player">
                <div th:replace="~{video-embed :: embed(${vm.videos()[0].key()}, false)}"></div>
                <p class="video-title" th:text="${vm.videos()[0].name()}">Trailer</p>
            </div>
            <ul class="crew video-list">
                <li th:each="v, iter : ${vm.videos()}" th:classappend="${iter.first} ? 'selected'">
                    <a th:href="'https://www.youtube.com/watch?v=' + ${v.key()}"
                       th:attr="hx-get=@{/videos/{key}(key=${v.key()},name=${v.name()})}"
                       hx-target="#player"
                       hx-swap="outerHTML"
                       th:text="${v.name()}">Trailer</a>
                    <span class="role" th:if="${v.type() != null}" th:text="${v.type()}">Trailer</span>
                </li>
            </ul>
        </dialog>
    </article>
</main>
<footer th:replace="~{footer :: footer}"></footer>
</body>
</html>
