<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<li th:fragment="card(c)" th:attr="data-movie-id=${c.tmdbId()}">
    <a class="card-link" th:href="'/movies/' + ${c.tmdbId()}">
        <span class="card-poster">
            <img th:if="${c.posterUrl() != null}" th:src="${c.posterUrl()}" alt="" loading="lazy">
        </span>
    </a>
    <div class="card-details">
        <a class="card-link card-info-link" th:href="'/movies/' + ${c.tmdbId()}">
            <span class="card-info">
                <span class="card-title" th:text="${c.title()}">Title</span>
                <span class="card-meta">
                    <span th:if="${c.year() != null}" th:text="${c.year()}">1979</span>
                    <span th:if="${c.meta() != null}" th:text="${c.meta()}">1h 52m</span>
                </span>
            </span>
            <span class="card-print-extra">
                <span th:if="${c.originalTitle() != null}" th:text="'Original title: ' + ${c.originalTitle()}">Original title</span>
                <span th:if="${c.directors() != null}" th:text="'Directed by ' + ${c.directors()}">Directed by</span>
            </span>
        </a>
        <button type="button" class="card-mark"
                th:attr="data-card-mark=${c.tmdbId()}"
                aria-label="Mark movie"
                aria-pressed="false">
            <th:block th:replace="~{bookmark-icon :: icon(14)}"></th:block>
        </button>
    </div>
</li>
</body>
</html>
