<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<li th:fragment="card(c, playlistId, note, noteEditUrl)" th:attr="data-movie-id=${c.tmdbId()}">
    <!-- playlist reorder controls: only rendered on the playlist page (playlistId set),
         hidden until Reorder mode is toggled on; both arrows are live — the edges wrap -->
    <div class="card-move" th:if="${playlistId != null}">
        <button type="button" class="card-move-btn" data-move="up" aria-label="Move earlier in the playlist"
                th:attr="hx-post='/playlists/' + ${playlistId} + '/movies/' + ${c.tmdbId()} + '/move'"
                hx-vals='{"dir": "up"}'
                hx-swap="none">‹</button>
        <button type="button" class="card-move-btn" data-move="down" aria-label="Move later in the playlist"
                th:attr="hx-post='/playlists/' + ${playlistId} + '/movies/' + ${c.tmdbId()} + '/move'"
                hx-vals='{"dir": "down"}'
                hx-swap="none">›</button>
    </div>
    <a class="card-link" th:href="'/movies/' + ${c.tmdbId()}">
        <span class="card-poster">
            <img th:if="${c.posterUrl() != null}" th:src="${c.posterUrl()}" alt="" loading="lazy">
        </span>
    </a>
    <div class="card-details">
        <a class="card-link card-info-link" th:href="'/movies/' + ${c.tmdbId()}">
            <span class="card-info">
                <span class="card-title" th:text="${c.title()}">Title</span>
                <span class="card-meta">
                    <span th:if="${c.year() != null}" th:text="${c.year()}">1979</span>
                    <span th:if="${c.meta() != null}" th:text="${c.meta()}">1h 52m</span>
                </span>
            </span>
            <span class="card-print-extra">
                <span th:if="${c.originalTitle() != null}" th:text="'Original title: ' + ${c.originalTitle()}">Original title</span>
                <span th:if="${c.directors() != null}" th:text="'Directed by ' + ${c.directors()}">Directed by</span>
            </span>
        </a>
        <button type="button" class="card-mark"
                th:attr="data-card-mark=${c.tmdbId()}"
                aria-label="Mark movie"
                aria-pressed="false">
            <th:block th:replace="~{bookmark-icon :: icon(14)}"></th:block>
        </button>
        <!-- personal note: mark note (marked page) or membership note (playlist
             page); lives inside the details row so the grid view can tuck the
             lone page icon right under the bookmark instead of dangling it in
             a row of its own; the page maps its context into note/editUrl -->
        <th:block th:if="${noteEditUrl != null}" th:with="editUrl=${noteEditUrl}">
            <div th:replace="~{note-area}"></div>
        </th:block>
    </div>
</li>
</body>
</html>
