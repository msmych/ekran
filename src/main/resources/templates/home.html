<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{head :: head('ekran — movie search')}"></head>
<body>
<div id="topbar" class="htmx-indicator" aria-hidden="true"></div>
<main class="wrap" hx-boost="true" hx-indicator="#topbar">
    <div th:replace="~{header :: header(true)}"></div>
    <div id="results" aria-live="polite">
        <th:block th:if="${resultsVm} != null" th:insert="~{results :: results}"></th:block>
    </div>
</main>
<footer th:replace="~{footer :: footer}"></footer>
</body>
</html>
