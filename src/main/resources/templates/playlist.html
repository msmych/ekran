<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{head :: head(${name} + ' — ekran')}"></head>
<body>
<div id="topbar" class="htmx-indicator" aria-hidden="true"></div>
<script defer src="/js/qrcode.js"></script>
<main class="wrap" hx-boost="true" hx-indicator="#topbar">
    <div th:replace="~{header :: header(false)}"></div>
    <section class="marked-list">
        <div class="list-head">
            <h2><span th:text="${name}">Playlist</span>
                <button type="button" class="list-name-edit" data-rename-toggle aria-label="Rename playlist">
                    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                        <path d="M2.5 13.5l.7-3L11.3 2.4l2.3 2.3-8.1 8.1-3 .7z"/>
                    </svg>
                </button>
            </h2>
            <!-- replaces the title in place while editing: the heading hides,
                 the form takes its left slot in the space-between row -->
            <form method="post" th:action="'/playlists/' + ${id} + '/rename'" class="playlist-rename-form"
                  data-rename-form hidden>
                <input type="text" name="name" maxlength="60" class="list-name-input" th:value="${name}"
                       aria-label="Playlist name" required>
                <button type="submit" class="chip-button">Save</button>
            </form>
            <div class="list-actions playlist-actions">
                <button type="button" class="chip-button" data-reorder-toggle th:hidden="${cards.isEmpty()}">Reorder</button>
                <button type="button" class="chip-button" data-dialog="share" th:hidden="${cards.isEmpty()}">Share</button>
                <button type="button" class="chip-button" data-print-list th:hidden="${cards.isEmpty()}">Print</button>
                <form method="post" th:action="'/playlists/' + ${id} + '/delete'"
                      hx-confirm="Delete this playlist? Its movies stay in your marks.">
                    <button type="submit" class="chip-button danger">Delete</button>
                </form>
            </div>
        </div>
        <ul class="movie-cards">
            <th:block th:each="c : ${cards}">
                <li th:replace="~{movie-card :: card(${c}, ${id})}"></li>
            </th:block>
        </ul>
        <div class="empty-list" th:hidden="${!cards.isEmpty()}">
            <p>This playlist is empty.</p>
            <p>Add movies to it from their pages.</p>
        </div>
        <dialog id="share" th:attr="data-share-url=@{/list(movie=${movieIds},name=${name})}">
            <div class="dialog-head">
                <h2>Share</h2>
                <button type="button" class="dialog-close" data-dialog-close aria-label="Close">✕</button>
            </div>
            <div class="qr-wrap" data-qr-target></div>
            <div class="qr-url-row">
                <a class="qr-url" data-qr-url-text href="#" target="_blank" rel="noopener"></a>
                <button type="button" class="chip-button" data-qr-copy aria-live="polite">Copy</button>
            </div>
        </dialog>
    </section>
</main>
<footer th:replace="~{footer :: footer}"></footer>
</body>
</html>
