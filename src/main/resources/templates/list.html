<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{head :: head('Marked — ekran')}"></head>
<body>
<div id="topbar" class="htmx-indicator" aria-hidden="true"></div>
<script defer src="/js/qrcode.js"></script>
<main class="wrap" hx-boost="true" hx-indicator="#topbar">
    <div th:replace="~{header :: header(false)}"></div>
    <section class="marked-list">
        <div class="list-head">
            <!-- the pencil lives INSIDE the title, right after the name (a sibling
                 button used to float mid-row: .list-head is space-between, so it
                 never sat next to the name). Both the text and the pencil start
                 the inline rename; the input is aligned to the title text -->
            <h2 data-list-title>
                <span data-list-title-text th:text="${title}">Marked movies</span>
                <button type="button" class="list-name-edit" data-list-name-edit aria-label="Rename list"
                        th:hidden="${cards.isEmpty()}">
                    <th:block th:replace="~{pencil-icon :: icon}"></th:block>
                </button>
            </h2>
            <input type="text" class="list-name-input" data-list-name-input maxlength="60" aria-label="List name" hidden>
            <div class="list-actions">
                <button type="button" class="chip-button" data-dialog="share" th:hidden="${cards.isEmpty()}">Share</button>
                <button type="button" class="chip-button" data-print-list th:hidden="${cards.isEmpty()}">Print</button>
                <button type="button" class="chip-button" th:if="${userId != null && !cards.isEmpty()}"
                        data-dialog="playlist-select"
                        th:attr="hx-get=@{/playlists/select(movie=${movieIds})}"
                        hx-target="#playlist-select-body"
                        hx-swap="innerHTML">Add to playlist</button>
                <button type="button" class="chip-button" data-mark-all hidden>Add all to marked</button>
                <button type="button" class="chip-button" data-clear-marks hidden>Clear all</button>
                <button type="button" class="chip-button" data-view-toggle aria-pressed="false">Rows</button>
            </div>
        </div>
        <ul class="movie-cards">
            <th:block th:each="c : ${cards}">
                <li th:replace="~{movie-card :: card(${c}, null, null, null)}"></li>
            </th:block>
        </ul>
        <div class="empty-list" th:hidden="${!cards.isEmpty()}">
            <p>No marked movies yet.</p>
            <p>Search for a movie and mark it to build a list.</p>
        </div>
        <th:block th:replace="~{share-dialog :: shareDialog(null)}"></th:block>
        <th:block th:replace="~{playlist-dialog :: playlistDialog}"></th:block>
    </section>
</main>
<footer th:replace="~{footer :: footer}"></footer>
</body>
</html>
