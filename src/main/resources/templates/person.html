<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{head :: head(${vm.name()} + ' — ekran')}"></head>
<body>
<div id="topbar" class="htmx-indicator" aria-hidden="true"></div>
<main class="wrap" hx-boost="true" hx-indicator="#topbar">
    <div th:replace="~{header :: header(false)}"></div>
    <article class="person">
        <header class="person-head">
            <img class="profile" th:if="${vm.profileUrl() != null}" th:src="${vm.profileUrl()}" alt="">
            <div>
                <h2 th:text="${vm.name()}">Name</h2>
                <p class="known-for" th:if="${vm.knownFor() != null}" th:text="'Known for ' + ${vm.knownFor()}">Known for Directing</p>
                <p class="external-links">
                    <a th:href="${vm.tmdbUrl()}" target="_blank" rel="noopener">TMDB ↗</a>
                </p>
            </div>
        </header>
        <nav class="tabs">
            <a th:href="${'/persons/' + vm.tmdbId()}"
               th:classappend="${vm.currentDepartment() == null} ? current"
               th:text="'All'">All</a>
            <a th:each="d : ${vm.departments()}"
               th:href="${'/persons/' + vm.tmdbId() + '/' + d.key()}"
               th:classappend="${vm.currentDepartment() == d.key()} ? current"
               th:text="${d.label()}">Directing</a>
        </nav>
        <section class="filmography" th:each="s : ${vm.sections()}">
            <h3 th:text="${s.label()}">Directing</h3>
            <ul class="movie-cards">
                <th:block th:each="i : ${s.items()}">
                    <li th:replace="~{movie-card :: card(${i})}"></li>
                </th:block>
            </ul>
        </section>
    </article>
</main>
<footer th:replace="~{footer :: footer}"></footer>
</body>
</html>
