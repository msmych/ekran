<!-- the personal note display: the note (when present) plus the edit affordance;
     GET editUrl (hx) swaps this whole area for the note-editor form.
     Rendered directly by the note routes and included whole by the pages.
     The page icon is the affordance everywhere — a present note turns it
     accent; the movie page additionally advertises the `n` hotkey in
     the label -->
<div class="card-note" xmlns:th="http://www.thymeleaf.org">
    <p class="card-note-text" th:if="${note != null}" th:text="${note}">note</p>
    <button type="button" class="card-note-toggle"
            th:with="label=${(note != null ? 'Edit note' : 'Add note') + (movieNote != null ? ' (n)' : '')}"
            th:classappend="${note != null} ? 'has-note'"
            th:attr="hx-get=${editUrl}"
            th:aria-label="${label}"
            th:title="${label}"
            hx-target="closest .card-note"
            hx-swap="outerHTML">
        <th:block th:replace="~{note-icon :: icon(14)}"></th:block>
    </button>
</div>
