<th:block th:fragment="results" xmlns:th="http://www.thymeleaf.org">
    <ul class="results" hx-boost="true" hx-indicator="#topbar" th:if="${!resultsVm.items().isEmpty()}">
        <li th:each="item : ${resultsVm.items()}">
            <a class="result" th:href="${item.href()}">
                <span class="thumb">
                    <img th:if="${item.imageUrl() != null}" th:src="${item.imageUrl()}" alt="" loading="lazy">
                </span>
                <span class="info">
                    <span class="title" th:text="${item.title()}">Title</span>
                    <span class="original-title" th:if="${item.originalTitle() != null}" th:text="${item.originalTitle()}">Original title</span>
                    <span class="meta">
                        <span th:if="${item.year() != null}" th:text="${item.year()}">1979</span>
                        <span th:if="${item.subtitle() != null}" th:text="${item.subtitle()}">7.8</span>
                    </span>
                </span>
            </a>
            <button type="button" class="card-mark"
                    th:if="${item.tmdbId() != null}"
                    th:attr="data-card-mark=${item.tmdbId()}"
                    aria-label="Mark movie"
                    aria-pressed="false">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                    <path d="M3.5 1.5h9a1 1 0 0 1 1 1v12l-5.5-3.7L2.5 14.5v-12a1 1 0 0 1 1-1z"/>
                </svg>
            </button>
        </li>
    </ul>
    <p class="no-results"
       th:if="${resultsVm.items().isEmpty() and !#strings.isEmpty(resultsVm.query())}">
        No results for “<span th:text="${resultsVm.query()}">query</span>”
    </p>
</th:block>
