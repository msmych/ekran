services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8080
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:?Export TMDB_API_TOKEN before running docker compose up}
    ports:
      - "7070:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"