services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8080
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:?Export TMDB_API_TOKEN before running docker compose up}
      DATABASE_URL: postgres://ekran:ekran@db:5432/ekran
      # dummy by default: the app boots and sign-in shows a retryable error;
      # export a real key to send actual magic links from localhost
      RESEND_API_KEY: ${RESEND_API_KEY:-dummy}
      PUBLIC_BASE_URL: http://localhost:7070
    ports:
      - "7070:8080"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ekran
      POSTGRES_PASSWORD: ekran
      POSTGRES_DB: ekran
    ports:
      # exposed to the host for the IDE DB explorer (avoid clashing with a local postgres)
      - "5433:5432"
    volumes:
      # postgres 18+: mount the parent dir so pg_upgrade stays inside the volume boundary
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekran -d ekran"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data: