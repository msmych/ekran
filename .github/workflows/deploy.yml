name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Full test suite
        run: ./gradlew check

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail

            command -v git >/dev/null || { echo "ERROR: git is not installed on this host" >&2; exit 1; }
            command -v docker >/dev/null || { echo "ERROR: docker is not installed on this host" >&2; exit 1; }

            # config-only checkout in the deploy user's home; first deploy bootstraps it
            # (init+fetch+checkout rather than clone — the dir may already hold the untracked .env),
            # later deploys pull config updates
            EKRAN_DIR="$HOME/ekran"
            if [ ! -d "$EKRAN_DIR/.git" ]; then
              mkdir -p "$EKRAN_DIR"
              git -C "$EKRAN_DIR" init -q
              git -C "$EKRAN_DIR" remote add origin "https://github.com/${{ github.repository }}.git" 2>/dev/null || true
              git -C "$EKRAN_DIR" fetch -q origin main \
                || { echo "ERROR: fetch failed — check network access to github.com from this host" >&2; exit 1; }
              git -C "$EKRAN_DIR" checkout -q -B main origin/main
            fi
            cd "$EKRAN_DIR"

            if [ ! -f .env ]; then
              echo "ERROR: create $EKRAN_DIR/.env with TMDB_API_TOKEN once on this host" >&2
              exit 1
            fi

            # GHCR packages are private by default — authenticate with the job token so the
            # server can pull regardless of package visibility; token expires with the job
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            # keep the currently deployed tag for rollback
            PREV_IMAGE=$(cat .deployed-image 2>/dev/null || true)
            NEW_IMAGE=${{ steps.image.outputs.name }}

            # the server keeps a config-only checkout of this repository
            git pull --ff-only

            APP_IMAGE="$NEW_IMAGE" docker compose pull app
            APP_IMAGE="$NEW_IMAGE" docker compose up -d app

            # health check: retry for up to ~30s, roll back on failure
            if ! timeout 30s sh -c 'until curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; do sleep 2; done'; then
              echo "health check failed for $NEW_IMAGE"
              if [ -n "$PREV_IMAGE" ]; then
                echo "rolling back to $PREV_IMAGE"
                APP_IMAGE="$PREV_IMAGE" docker compose up -d app
                curl -fsS http://127.0.0.1:8080/health
              fi
              exit 1
            fi

            echo "$NEW_IMAGE" > .deployed-image
            echo "deployed $NEW_IMAGE"

            # roll out nginx/conf.d changes (bind-mounted): reload keeps the old
            # workers if the new config fails to load, so a bad conf never takes
            # the site down — it just fails this deploy loudly. APP_IMAGE is set
            # because compose interpolates the file for any subcommand, exec included
            APP_IMAGE="$NEW_IMAGE" docker compose exec -T nginx nginx -s reload