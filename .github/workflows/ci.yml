name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew check

      - name: Build production image
        run: docker build -t ekran:ci .

      - name: Container smoke test
        run: |
          docker run -d --name ekran-smoke -p 127.0.0.1:18080:8080 -e TMDB_API_TOKEN=dummy ekran:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18080/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health | grep -q '"UP"'
          docker rm -f ekran-smoke